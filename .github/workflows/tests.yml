name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install linters
        run: pip install "black>=23.0" "flake8>=6.0" "isort>=5.12"

      - name: Run flake8
        run: |
          flake8 cy_redis/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 cy_redis/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check black formatting
        run: black --check cy_redis/ tests/ examples/

      - name: Check isort imports
        run: isort --check-only cy_redis/ tests/ examples/

  test-linux:
    name: Test on Ubuntu - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test the ends of the supported range; main tests all of it.
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.9", "3.11", "3.14"]') || fromJSON('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]') }}

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Module-bearing servers: the JSON and search wrappers are unreachable on
      # the plain images above, and the two ecosystems ship different builds.
      redis-stack:
        image: redis/redis-stack-server:7.2.0-v11
        ports:
          - 6382:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      valkey-bundle:
        image: valkey/valkey-bundle:8
        ports:
          - 6383:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyredis
          POSTGRES_PASSWORD: cyredis_test_password
          POSTGRES_DB: cyredis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyredis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UV
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpq-dev libssl-dev

      - name: Install package
        run: uv pip install --system -e ".[dev,test]"

      - name: Run fast tests
        run: python -m pytest -v -m "not slow and not cluster" tests/

      - name: Run fast tests against Valkey
        env:
          REDIS_PORT: 6380
        run: python -m pytest -v -m "not slow and not cluster" tests/

      - name: Run module parity tests against Redis Stack
        env:
          REDIS_PORT: 6382
        run: python -m pytest -v tests/unit/test_module_parity.py

      - name: Run module parity tests against valkey-bundle
        env:
          REDIS_PORT: 6383
        run: python -m pytest -v tests/unit/test_module_parity.py

      - name: Run all tests with coverage
        if: matrix.python-version == '3.11'
        run: python -m pytest -v --cov=cy_redis --cov-report=xml --cov-report=term-missing tests/

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  test-macos:
    name: Test on macOS - Python 3.11
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install UV
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          brew list redis >/dev/null 2>&1 || brew install redis

      - name: Start Redis
        # 6380 stands in for the valkey service the Linux jobs get.
        run: |
          redis-server --daemonize yes --port 6379
          redis-server --daemonize yes --port 6380
          redis-cli ping

      - name: Install package
        run: uv pip install --system --break-system-packages -e ".[dev,test]"

      - name: Run fast tests
        run: python -m pytest -v -m "not slow and not cluster and not integration" tests/

  packaging:
    name: Packaging (sdist, wheel, clean install)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install UV
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Install the wheel into a clean environment
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env/bin/python dist/*.whl

      - name: Import and read package data from the installed wheel
        # Run outside the checkout so the source tree cannot shadow the install.
        working-directory: /tmp
        run: |
          /tmp/wheel-env/bin/python -c "
          import cy_redis
          from cy_redis.core import tls_support
          from cy_redis.lua_scripts import available_scripts, script_source
          tls_support.create_ssl_context()
          assert available_scripts(), 'no Lua scripts in the wheel'
          assert all(script_source(name) for name in available_scripts())
          print(cy_redis.__version__, available_scripts())
          "

      - name: Install the sdist from source
        run: |
          uv venv /tmp/sdist-env
          uv pip install --python /tmp/sdist-env/bin/python --no-binary cy-redis dist/*.tar.gz

      - name: Import from the sdist install
        working-directory: /tmp
        run: /tmp/sdist-env/bin/python -c "import cy_redis; print(cy_redis.__version__)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-linux

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyredis
          POSTGRES_PASSWORD: cyredis_test_password
          POSTGRES_DB: cyredis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyredis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install UV
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpq-dev libssl-dev

      - name: Install package
        run: uv pip install --system -e ".[dev,test]"

      - name: Run integration tests
        run: python -m pytest -v -m "integration" tests/

      - name: Run integration tests against Valkey
        env:
          REDIS_PORT: 6380
        run: python -m pytest -v -m "integration" tests/

  cluster-and-sentinel:
    name: Cluster and Sentinel
    runs-on: ubuntu-latest
    needs: test-linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install UV
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Build vendored hiredis
        run: |
          cd hiredis
          make clean || true
          make static USE_SSL=1
          cd ..

      - name: Install package
        run: uv pip install --system -e ".[dev,test]"

      # Cluster and sentinel nodes gossip their own addresses, so the
      # containers have to share the runner's network namespace: a bridged
      # port mapping would advertise addresses the client cannot reach.
      - name: Start a six-node Redis Cluster
        run: |
          for port in 7000 7001 7002 7003 7004 7005; do
            docker run -d --name "cluster-$port" --network host redis:7 \
              redis-server --port "$port" --cluster-enabled yes \
              --cluster-config-file "/data/$port.conf" \
              --cluster-node-timeout 5000 --appendonly no
          done
          timeout 60 sh -c 'until docker exec cluster-7005 redis-cli -p 7005 ping 2>/dev/null | grep -q PONG; do sleep 1; done'
          docker run --rm --network host redis:7 redis-cli --cluster create \
            127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 \
            127.0.0.1:7003 127.0.0.1:7004 127.0.0.1:7005 \
            --cluster-replicas 1 --cluster-yes

      - name: Start a sentinel-monitored master and replica
        run: |
          docker run -d --name sentinel-master --network host redis:7 \
            redis-server --port 7100 --appendonly no
          docker run -d --name sentinel-replica --network host redis:7 \
            redis-server --port 7101 --appendonly no --replicaof 127.0.0.1 7100
          mkdir -p "$RUNNER_TEMP/sentinel"
          for port in 26379 26380 26381; do
            cat > "$RUNNER_TEMP/sentinel/$port.conf" <<EOF
          port $port
          sentinel monitor mymaster 127.0.0.1 7100 2
          sentinel down-after-milliseconds mymaster 2000
          sentinel failover-timeout mymaster 5000
          EOF
            docker run -d --name "sentinel-$port" --network host \
              -v "$RUNNER_TEMP/sentinel:/cfg" redis:7 \
              sh -c "cp /cfg/$port.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
          done
          timeout 60 sh -c 'until docker exec sentinel-26379 redis-cli -p 26379 sentinel get-master-addr-by-name mymaster 2>/dev/null | grep -q 7100; do sleep 1; done'

      - name: Run the cluster tests
        env:
          REDIS_CLUSTER_NODES: 127.0.0.1:7000,127.0.0.1:7001,127.0.0.1:7002
        run: python -m pytest -v tests/integration/test_cluster_operations.py tests/unit/test_cluster_routing.py

      - name: Run the sentinel tests
        env:
          REDIS_SENTINEL_HOSTS: 127.0.0.1:26379,127.0.0.1:26380,127.0.0.1:26381
          REDIS_SENTINEL_MASTER: mymaster
        run: python -m pytest -v tests/integration/test_sentinel_failover.py

      - name: Show node logs on failure
        if: failure()
        run: |
          for name in cluster-7000 sentinel-master sentinel-26379; do
            echo "── $name"
            docker logs "$name" || true
          done
