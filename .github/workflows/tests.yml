name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test-linux:
    name: Test on Ubuntu - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyredis
          POSTGRES_PASSWORD: cyredis_test_password
          POSTGRES_DB: cyredis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyredis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify UV installation
        run: uv --version

      - name: Cache UV dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv
          key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-${{ matrix.python-version }}-
            ${{ runner.os }}-uv-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpq-dev libssl-dev

      - name: Build vendored hiredis
        run: |
          cd hiredis
          make clean || true
          make static USE_SSL=1
          cd ..

      - name: Install build dependencies
        run: |
          uv pip install --system setuptools wheel Cython

      - name: Install Python dependencies
        run: |
          uv pip install --system -e ".[dev,test]"
          uv pip install --system pytest-watch pytest-xdist

      - name: Run fast tests
        run: |
          python -m pytest -v -m "not slow and not cluster" tests/

      - name: Run all tests with coverage
        if: matrix.python-version == '3.11'
        run: |
          python -m pytest -v --cov=cy_redis --cov-report=xml --cov-report=term-missing tests/

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  test-macos:
    name: Test on macOS - Python ${{ matrix.python-version }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']  # Just test one version on macOS for now

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify UV installation
        run: uv --version

      - name: Install system dependencies
        run: |
          brew install postgresql
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3

      - name: Build vendored hiredis
        run: |
          cd hiredis
          make clean || true
          OPENSSL_PREFIX=$(brew --prefix openssl@3) make static USE_SSL=1
          cd ..

      - name: Install build dependencies
        run: |
          uv pip install --system --break-system-packages setuptools wheel Cython

      - name: Install Python dependencies
        run: |
          uv pip install --system --break-system-packages -e ".[dev,test]"
          uv pip install --system --break-system-packages pytest-watch pytest-xdist

      - name: Run fast tests
        run: |
          python -m pytest -v -m "not slow and not cluster" tests/ || echo "Tests may fail without Redis/Postgres services on macOS"

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Build vendored hiredis
        run: |
          cd hiredis
          make clean || true
          make static USE_SSL=1
          cd ..

      - name: Install build dependencies
        run: |
          uv pip install --system setuptools wheel Cython

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run flake8
        run: |
          python -m flake8 cy_redis/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m flake8 cy_redis/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check black formatting
        run: |
          python -m black --check cy_redis/ tests/ examples/

      - name: Check isort imports
        run: |
          python -m isort --check-only cy_redis/ tests/ examples/

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-linux

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyredis
          POSTGRES_PASSWORD: cyredis_test_password
          POSTGRES_DB: cyredis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyredis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpq-dev libssl-dev

      - name: Build vendored hiredis
        run: |
          cd hiredis
          make clean || true
          make static USE_SSL=1
          cd ..

      - name: Install build dependencies
        run: |
          uv pip install --system setuptools wheel Cython

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev,test]"

      - name: Run integration tests
        run: |
          python -m pytest -v -m "integration" tests/

  cluster-and-sentinel:
    name: Cluster and Sentinel
    runs-on: ubuntu-latest
    needs: test-linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Build vendored hiredis
        run: |
          cd hiredis
          make clean || true
          make static USE_SSL=1
          cd ..

      - name: Install build dependencies
        run: uv pip install --system setuptools wheel Cython

      - name: Install dependencies
        run: uv pip install --system -e ".[dev,test]"

      # Cluster and sentinel nodes gossip their own addresses, so the
      # containers have to share the runner's network namespace: a bridged
      # port mapping would advertise addresses the client cannot reach.
      - name: Start a six-node Redis Cluster
        run: |
          for port in 7000 7001 7002 7003 7004 7005; do
            docker run -d --name "cluster-$port" --network host redis:7 \
              redis-server --port "$port" --cluster-enabled yes \
              --cluster-config-file "/data/$port.conf" \
              --cluster-node-timeout 5000 --appendonly no
          done
          timeout 60 sh -c 'until docker exec cluster-7005 redis-cli -p 7005 ping 2>/dev/null | grep -q PONG; do sleep 1; done'
          docker run --rm --network host redis:7 redis-cli --cluster create \
            127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 \
            127.0.0.1:7003 127.0.0.1:7004 127.0.0.1:7005 \
            --cluster-replicas 1 --cluster-yes

      - name: Start a sentinel-monitored master and replica
        run: |
          docker run -d --name sentinel-master --network host redis:7 \
            redis-server --port 7100 --appendonly no
          docker run -d --name sentinel-replica --network host redis:7 \
            redis-server --port 7101 --appendonly no --replicaof 127.0.0.1 7100
          mkdir -p "$RUNNER_TEMP/sentinel"
          for port in 26379 26380 26381; do
            cat > "$RUNNER_TEMP/sentinel/$port.conf" <<EOF
          port $port
          sentinel monitor mymaster 127.0.0.1 7100 2
          sentinel down-after-milliseconds mymaster 2000
          sentinel failover-timeout mymaster 5000
          EOF
            docker run -d --name "sentinel-$port" --network host \
              -v "$RUNNER_TEMP/sentinel:/cfg" redis:7 \
              sh -c "cp /cfg/$port.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
          done
          timeout 60 sh -c 'until docker exec sentinel-26379 redis-cli -p 26379 sentinel get-master-addr-by-name mymaster 2>/dev/null | grep -q 7100; do sleep 1; done'

      - name: Run the cluster tests
        env:
          REDIS_CLUSTER_NODES: 127.0.0.1:7000,127.0.0.1:7001,127.0.0.1:7002
        run: python -m pytest -v tests/integration/test_cluster_operations.py tests/unit/test_cluster_routing.py

      - name: Run the sentinel tests
        env:
          REDIS_SENTINEL_HOSTS: 127.0.0.1:26379,127.0.0.1:26380,127.0.0.1:26381
          REDIS_SENTINEL_MASTER: mymaster
        run: python -m pytest -v tests/integration/test_sentinel_failover.py

      - name: Show node logs on failure
        if: failure()
        run: |
          for name in cluster-7000 sentinel-master sentinel-26379; do
            echo "── $name"
            docker logs "$name" || true
          done

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: [test-linux, lint]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Build vendored hiredis
        run: |
          cd hiredis
          make clean || true
          make static USE_SSL=1
          cd ..

      - name: Install build dependencies
        run: |
          uv pip install --system build wheel setuptools Cython

      - name: Build source distribution
        run: |
          python -m build --sdist

      - name: Build wheel
        run: |
          python -m build --wheel

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
