name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install linters
        run: pip install "black>=23.0" "flake8>=6.0" "isort>=5.12"

      - name: Run flake8
        run: |
          flake8 cy_redis/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 cy_redis/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check black formatting
        run: black --check cy_redis/ tests/ examples/

      - name: Check isort imports
        run: isort --check-only cy_redis/ tests/ examples/

  test-linux:
    name: Test on Ubuntu - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test the ends of the supported range; main tests all of it.
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.9", "3.11", "3.14"]') || fromJSON('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]') }}

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyredis
          POSTGRES_PASSWORD: cyredis_test_password
          POSTGRES_DB: cyredis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyredis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UV
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpq-dev libssl-dev

      - name: Install package
        run: uv pip install --system -e ".[dev,test]"

      - name: Run fast tests
        run: python -m pytest -v -m "not slow and not cluster" tests/

      - name: Run all tests with coverage
        if: matrix.python-version == '3.11'
        run: python -m pytest -v --cov=cy_redis --cov-report=xml --cov-report=term-missing tests/

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  test-macos:
    name: Test on macOS - Python 3.11
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install UV
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          brew list redis >/dev/null 2>&1 || brew install redis

      - name: Start Redis
        # 6380 stands in for the valkey service the Linux jobs get.
        run: |
          redis-server --daemonize yes --port 6379
          redis-server --daemonize yes --port 6380
          redis-cli ping

      - name: Install package
        run: uv pip install --system --break-system-packages -e ".[dev,test]"

      - name: Run fast tests
        run: python -m pytest -v -m "not slow and not cluster and not integration" tests/

  packaging:
    name: Packaging (sdist, wheel, clean install)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install UV
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Install the wheel into a clean environment
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env/bin/python dist/*.whl

      - name: Import and read package data from the installed wheel
        # Run outside the checkout so the source tree cannot shadow the install.
        working-directory: /tmp
        run: |
          /tmp/wheel-env/bin/python -c "
          import cy_redis
          from cy_redis.core import tls_support
          from cy_redis.lua_scripts import available_scripts, script_source
          tls_support.create_ssl_context()
          assert available_scripts(), 'no Lua scripts in the wheel'
          assert all(script_source(name) for name in available_scripts())
          print(cy_redis.__version__, available_scripts())
          "

      - name: Install the sdist from source
        run: |
          uv venv /tmp/sdist-env
          uv pip install --python /tmp/sdist-env/bin/python --no-binary cy-redis dist/*.tar.gz

      - name: Import from the sdist install
        working-directory: /tmp
        run: /tmp/sdist-env/bin/python -c "import cy_redis; print(cy_redis.__version__)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-linux

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyredis
          POSTGRES_PASSWORD: cyredis_test_password
          POSTGRES_DB: cyredis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyredis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install UV
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpq-dev libssl-dev

      - name: Install package
        run: uv pip install --system -e ".[dev,test]"

      - name: Run integration tests
        run: python -m pytest -v -m "integration" tests/
